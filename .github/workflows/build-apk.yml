name: build apk

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Android SDK
        continue-on-error: true
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass aktzhilya2026 -keypass aktzhilya2026 \
            -dname "CN=AktZhilya, O=Studio, C=RU"

      - name: Build release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: aktzhilya2026
          KEY_PASSWORD: aktzhilya2026
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect apk
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} out/aktzhilya.apk \;
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aktzhilya-apk
          path: out/aktzhilya.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "АктЖилья 1.0.${{ github.run_number }}"
          body: "Сборка приложения для установки на телефон. Скачайте aktzhilya.apk."
          files: out/aktzhilya.apk
